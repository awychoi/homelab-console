name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: cd app && python -m unittest discover -s tests -v

  build:
    runs-on: macos-14
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install "pyinstaller>=6.16"
      - name: Build the app bundle
        env:
          HLC_PYTHON: python
          HLC_BUNDLE_ID: dev.homelab-console.ci
        run: desktop/build_app.sh
      - name: Inspect the bundle
        run: |
          file "dist/Homelab Console.app/Contents/MacOS/Homelab Console"
          test -f "dist/Homelab Console.app/Contents/Resources/LICENSE"
          test -f "dist/Homelab Console.app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -f "dist/Homelab Console.app/Contents/Resources/licenses/Python-3.14.8.txt"
          test -f "dist/Homelab Console.app/Contents/Resources/licenses/OpenSSL-4.0.3.txt"
          test -f "dist/Homelab Console.app/Contents/Resources/BUILD_INFO.txt"
          codesign -dv "dist/Homelab Console.app" 2>&1 | head -5 || true
